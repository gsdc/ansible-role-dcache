---
# Head node without pools. Run on a separate host from test-backend.yml.
- hosts: localhost
  remote_user: root
  vars_files:
    - vars/common.yml
  roles:
    - role: geonmo.dcache
      vars:
        dcache_layout_type: frontend
        dcache_site_unique_id: "EXAMPLE-SITE"
        dcache_srr_shares: "default:cms"
        dcache_srr_storage_descriptor_path: "/pnfs/example.org/data/SRR/storage-descriptor.json"
        dcache_java_heap: "2048m"
        dcache_ftp_limits_clients: 500
        dcache_enable_srm: true
        dcache_srm_port: 8446
