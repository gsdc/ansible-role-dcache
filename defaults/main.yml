---
# defaults file for geonmo.dcache
# 사이트 표준 dcache 서비스 계정 UID/GID. 새 장비에 처음 dcache를 설치할 때
# 이 값으로 계정을 만들어(로컬이든 LDAP이든) 항상 같은 UID/GID를 쓰도록
# 강제한다 - 그렇지 않으면 dcache RPM의 postinstall이 호스트마다 제각각인
# system UID로 계정을 만들어버려서, 나중에 풀 데이터 소유권이 호스트마다
# 어긋나는 문제가 생긴다(belle-se2-disk02, belle-se2-head에서 실제로 발생).
dcache_uid: 556951466
dcache_gid: 556951466
psql_version: 18
dcache_version: 10.2.18
dcache_volumes: 
  - {name:"ngnu01-pool", path:"/ngnu/dcache/01"}
dcache_headnode: "{{ ansible_fqdn }}"
dcache_use_voms: true
dcache_use_oidc: true
dcache_use_htpasswd: true
dcache_xrootd:
  readpath: "/"
  writepath: "/"
  port: 1094
dcache_webdav:
  cellname: "webdav"
  root: "/"
  protocol: "https"
  redirect_on_read: false
  redirect_on_write: false

#multimaps:
#  - scheme: "op"
#    principal: "VO"
#    uid: 50000
#    gid: 50000
#    primary: true
#    username: "vouser"
multimaps: []
dcache_layout_type: "" # backend|frontend|standalone

# frontend 타입(zookeeper/info/srr/door 등 pool이 없는 head 노드) 전용 설정.
# belle-se2-head의 실사용 /etc/dcache/layouts/nonpool.conf 구조를 그대로
# 옮긴 것이라, 아래 두 값은 필수(default 없음) - group_vars/host_vars에서
# 반드시 지정해야 한다.
# dcache_site_unique_id: "KR-KISTI-GSDC-BELLE"
# dcache_srr_shares: "default:belle"
# 선택 항목(지정 안 하면 아래 기본값 사용)
# dcache_java_heap: "16384m"
# dcache_ftp_limits_clients: 2000
# dcache_linkgroup_authorization_file: "/etc/dcache/LinkGroupAuthorization.conf"
# dcache_srr_storage_descriptor_path: "/dpm/sdfarm.kr/home/belle/SRR/storage-descriptor.json"
# SRM은 더 이상 권장되지 않는 추세라 기본은 비활성. 필요한 사이트만 켠다.
dcache_enable_srm: false
# dcache_srm_port: 8446

# Certificate management (optional)
dcache_manage_hostcert: false
dcache_manage_hostkey: false
# If using external paths, set these to absolute/local paths
dcache_hostcert_src: ~
dcache_hostkey_src: ~
# If providing inline PEM via vars (e.g., Vault), set these
dcache_hostcert_pem: ~
dcache_hostkey_pem: ~
# Ownership defaults (keep current behavior unless overridden)
dcache_cert_owner: dcache
dcache_cert_group: dcache
dcache_key_owner: dcache
dcache_key_group: dcache

# Unified account definition; used to render both storage-authzdb and grid-vorolemap
# Example structure:
# dcache_accounts:
#   - username: "cmsusers"
#     uid: 11704
#     gid: 1399
#     permission: "read-write"  # default permission for entries
#     entries:
#       - root: "/"
#         path: "/pnfs/sdfarm.kr/data/cms/"
#     voms_fqans:
#       - "/cms/Role=NULL/Capability=NULL"
dcache_accounts: []
