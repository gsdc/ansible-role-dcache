---
# defaults file for geonmo.dcache
# Site-wide UID/GID for the dcache service account. When set, the role creates
# the account with these IDs before installing dCache (unless it already exists
# locally or in LDAP) and fails if an existing account has different IDs.
# When unset (~), the dcache RPM postinstall creates it with whatever system UID
# is free on each host, so multi-node sites should set these to keep pool data
# ownership consistent across hosts. Set both or neither.
dcache_uid: ~
dcache_gid: ~
psql_version: 18
dcache_version: 11.2.9
# Example: [{name: "pool01", path: "/data/dcache/01", size: "100T"}]
dcache_volumes: []
dcache_headnode: "{{ ansible_fqdn }}"
# Default JVM heap for all dCache domains.
dcache_java_heap: "4096m"
dcache_use_voms: true
# OIDC/token authentication. Each provider becomes a
# gplazma.oidc.provider!<name> = <issuer> <options> line in dcache.conf;
# map users with `multimaps` (scheme "op", principal = provider name) or with
# -authz-id in options. Example (CMS):
# dcache_oidc_providers:
#   - name: cms
#     issuer: "https://cms-auth.cern.ch/"
#     options: "-profile=wlcg -prefix=/pnfs/example.org/data/cms"
dcache_use_oidc: false
dcache_oidc_providers: []
# htpasswd authentication. Users are written to /etc/dcache/htpasswd on
# frontend/standalone nodes; keep passwords in Ansible Vault.
# Example: [{name: "admin", password: "{{ vault_dcache_admin_password }}"}]
dcache_use_htpasswd: false
dcache_htpasswd_users: []
dcache_xrootd:
  readpath: "/"
  writepath: "/"
  port: 1094
dcache_webdav:
  cellname: "webdav"
  root: "/"
  protocol: "https"
  redirect_on_read: false
  redirect_on_write: false

#multimaps:
#  - scheme: "op"
#    principal: "cms"
#    uid: 61001
#    gid: 2610
#    primary: true
#    username: "cmsprod"
multimaps: []
dcache_layout_type: "" # backend|frontend|standalone

# Settings for the "frontend" layout (head node without pools: zookeeper, info,
# SRR, doors, ...). The following two are required and have no default since
# they are site/VO specific - set them in group_vars/host_vars.
# dcache_site_unique_id: "EXAMPLE-SITE"
# dcache_srr_shares: "default:cms"
dcache_ftp_limits_clients: 2000
dcache_linkgroup_authorization_file: "/etc/dcache/LinkGroupAuthorization.conf"
# If set, written to storage-descriptor.output.path.
# Example: "/pnfs/example.org/data/SRR/storage-descriptor.json"
dcache_srr_storage_descriptor_path: ""
# SRM is being phased out, so it is disabled by default. Enable only if needed.
dcache_enable_srm: false
dcache_srm_port: 8446

# "standalone" layout only. Empty values are not rendered (dCache defaults apply).
# dcache_kerberos_realm: "EXAMPLE.ORG"
dcache_kerberos_realm: ""
# JVM heap of the XRootD and WebDAV door domains.
dcache_xrootd_java_heap: "16384m"
dcache_webdav_java_heap: "16384m"
# GID -> path mapping for tape (STAR) integration. Example: {2610: "/cms"}
dcache_star_gid_mapping: {}

# Pool firefly (SciTags transfer flow marking, dCache >= 11.2.4 recommended).
# Fireflies always go to the transfer peer on UDP 10514; the destination below
# receives an additional copy (default: the global SciTags collector run by ESnet).
# Set it to "" to send only to the transfer peer.
dcache_pool_enable_firefly: false
# Networks to skip, e.g. internal transfers: ["10.0.0.0/8", "192.168.0.0/16"]
dcache_pool_firefly_excludes: []
dcache_pool_firefly_destination: "collector.scitags.org:10514"

# Certificate management (optional)
dcache_manage_hostcert: false
dcache_manage_hostkey: false
# If using external paths, set these to absolute/local paths
dcache_hostcert_src: ~
dcache_hostkey_src: ~
# If providing inline PEM via vars (e.g., Vault), set these
dcache_hostcert_pem: ~
dcache_hostkey_pem: ~
# Ownership defaults (keep current behavior unless overridden)
dcache_cert_owner: dcache
dcache_cert_group: dcache
dcache_key_owner: dcache
dcache_key_group: dcache

# Unified account definition; used to render both storage-authzdb and grid-vorolemap
# Example structure:
# dcache_accounts:
#   - username: "cmsprod"
#     uid: 61001
#     gid: 2610
#     permission: "read-write"  # default permission for entries
#     entries:
#       - root: "/"
#         path: "/pnfs/example.org/data/cms/"
#     voms_fqans:
#       - "/cms/Role=production/Capability=NULL"
dcache_accounts: []
