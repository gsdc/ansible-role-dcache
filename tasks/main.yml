---
# tasks file for geonmo.dcache
#
# dcache_install_mode selects how dCache runs on the target host:
#   rpm        install the dCache RPM on the host (install.yml)
#   container  pull the dCache + systemd image built by this repository's GitHub
#              Actions (container_image.yml) and generate one podman quadlet per
#              domain from the layout (quadlet.yml)
# In container mode, `--tags dcache_quadlet` regenerates only the quadlets
# (e.g. after a layout change).
- name: Check dcache_install_mode
  ansible.builtin.assert:
    that:
      - dcache_install_mode in ["rpm", "container"]
    fail_msg: "dcache_install_mode must be 'rpm' or 'container' (got '{{ dcache_install_mode }}')."
  tags: [always]

- name: Install and configure dCache on the host (rpm mode)
  ansible.builtin.include_tasks: install.yml
  when: dcache_install_mode == "rpm"

- name: Pull the dCache container image (container mode)
  ansible.builtin.include_tasks:
    file: container_image.yml
    apply:
      tags: [dcache_container_image]
  when: dcache_install_mode == "container"
  tags: [dcache_container_image]

- name: Generate dCache domain quadlets from the layout (container mode)
  ansible.builtin.include_tasks:
    file: quadlet.yml
    apply:
      tags: [dcache_quadlet]
  when: dcache_install_mode == "container"
  tags: [dcache_quadlet]
