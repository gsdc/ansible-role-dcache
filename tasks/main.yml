---
# tasks file for geonmo.dcache
#
# Install/configure dCache on the host (install.yml), and/or generate one podman
# quadlet per dCache domain from a layout file (quadlet.yml).
#   - default:                     install.yml (+ quadlet.yml when dcache_quadlet_enable)
#   - dcache_quadlet_only: true    quadlet.yml only (e.g. a container-only head node)
#   - --tags dcache_quadlet        quadlet.yml only (regenerate after a layout change)
- name: Install and configure dCache on the host
  ansible.builtin.include_tasks: install.yml
  when: not (dcache_quadlet_only | bool)

- name: Generate dCache domain quadlets from the layout
  ansible.builtin.include_tasks:
    file: quadlet.yml
    apply:
      tags: [dcache_quadlet]
  when: (dcache_quadlet_enable | bool) or (dcache_quadlet_only | bool)
  tags: [dcache_quadlet]
