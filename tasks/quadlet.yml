---
# Generate one podman quadlet (.container) per dCache domain found in a layout file.
#
# Each container runs systemd as PID 1. The dCache systemd generator inside the
# container creates dcache@<domain>.service for every domain in the layout;
# the container starts only its own domain:
#   Exec=/sbin/init systemd.mask=dcache.target systemd.wants=dcache@<domain>.service
# (systemd in a container reads these options from its own argv.)
#
# The image (dcache_container_image) is built by this repository's GitHub
# Actions from container/Containerfile: systemd + the dCache RPM (generator).
#
# Shared configuration (e.g. /etc/dcache) MUST be mounted with the lowercase
# ":z" SELinux option. With ":Z" every container relabels the file for itself
# and the others get "Permission denied" (the generator then silently creates
# no units, because generator output is lost in a container).
#
# Do not share /var/lib/dcache/config between containers: the generator writes
# its config cache to /var/lib/dcache/config/cache in every container. Mount it
# only into the domain that needs it (dcache_quadlet_domain_volumes).

- name: Check quadlet variables
  ansible.builtin.assert:
    that:
      - dcache_container_image | length > 0
      - dcache_quadlet_layout_path | length > 0
    fail_msg: "Set dcache_container_image and dcache_quadlet_layout_path."

- name: Read the layout file
  ansible.builtin.slurp:
    src: "{{ dcache_quadlet_layout_path }}"
  register: _dcache_quadlet_layout

# Domain sections are "[name]" lines without "/" (cells are "[domain/cell]").
# ${host.name} is expanded with dcache_quadlet_hostname, the host name seen
# inside the containers (dCache expands it the same way when it starts).
- name: Find domains in the layout
  ansible.builtin.set_fact:
    _dcache_quadlet_domains: >-
      {{ (_dcache_quadlet_layout.content | b64decode)
         | regex_findall('(?m)^\s*\[([^\]/\s]+)\]\s*$')
         | map('replace', '${host.name}', dcache_quadlet_hostname)
         | unique | list }}

- name: Check that every domain name is fully expanded
  ansible.builtin.assert:
    that:
      - _dcache_quadlet_domains | length > 0
      - _dcache_quadlet_domains | select('search', '\$\{') | list | length == 0
    fail_msg: >-
      Domains found: {{ _dcache_quadlet_domains }}. Either no domain was found in
      {{ dcache_quadlet_layout_path }}, or a domain name still contains an
      unexpanded property (only ${host.name} is supported).

- name: Ensure the quadlet directory exists
  ansible.builtin.file:
    path: "{{ dcache_quadlet_dir }}"
    state: directory
    mode: "0755"

- name: Ensure per-domain journal directories exist
  ansible.builtin.file:
    path: "{{ dcache_quadlet_journal_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ _dcache_quadlet_domains }}"
  when: dcache_quadlet_journal_dir | length > 0

- name: Write one quadlet per domain
  ansible.builtin.template:
    src: dcache-domain.container.j2
    dest: "{{ dcache_quadlet_dir }}/{{ dcache_quadlet_name_prefix }}{{ item }}.container"
    mode: "0644"
  loop: "{{ _dcache_quadlet_domains }}"
  vars:
    domain: "{{ item }}"
  register: _dcache_quadlet_written

# Quadlets written by this role carry the marker below. Remove those whose
# domain is no longer in the layout (only files with the same name prefix).
- name: Find quadlets previously generated by this role
  ansible.builtin.find:
    paths: "{{ dcache_quadlet_dir }}"
    patterns: "{{ dcache_quadlet_name_prefix }}*.container"
    contains: "X-Generated-By=gsdc.dcache"
  register: _dcache_quadlet_existing

- name: Remove quadlets of domains that are no longer in the layout
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _dcache_quadlet_existing.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  # Domain = file name without the prefix and ".container". (No regex here: in a
  # Jinja string literal '\1' becomes a control character, not a back-reference.)
  when: >-
    (item.path | basename)[(dcache_quadlet_name_prefix | length):-10]
    not in _dcache_quadlet_domains
  register: _dcache_quadlet_removed

- name: Reload systemd (quadlet generator)
  ansible.builtin.systemd:
    daemon_reload: true
  when: (_dcache_quadlet_written is changed) or (_dcache_quadlet_removed is changed)

# Same rule as the host install: nothing is started unless dcache_start is true.
- name: Restart changed domain containers (only when dcache_start is true)
  ansible.builtin.systemd:
    name: "{{ dcache_quadlet_name_prefix }}{{ item.item }}.service"
    state: restarted
  loop: "{{ _dcache_quadlet_written.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - dcache_start | bool
    - item is changed

- name: Generated domain quadlets
  ansible.builtin.debug:
    msg: >-
      {{ _dcache_quadlet_domains | map('regex_replace', '^', dcache_quadlet_name_prefix)
         | map('regex_replace', '$', '.service') | list }}
